name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (formatação)
        run: python -m ruff format --check .

      - name: Bandit
        run: python -m bandit -r cryptovault -q

      - name: pip-audit (runtime)
        run: python -m pip_audit -r requirements.txt

      - name: Pytest com cobertura
        run: python -m pytest --cov=cryptovault --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build Windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev]"

      - name: Construir e executar self-test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Publicar executável e evidências
        uses: actions/upload-artifact@v4
        with:
          name: CryptoVault-windows-x64
          path: |
            dist/CryptoVault.exe
            dist/CryptoVault.exe.sha256
            dist/self-test.json
          if-no-files-found: error
